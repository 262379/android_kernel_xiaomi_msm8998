name: Build Xiaomi MIX2 MSM8998 KernelSU-Next

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc \
            bison \
            flex \
            build-essential \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            gcc-arm-linux-gnueabihf \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            device-tree-compiler \
            curl \
            python3 \
            unzip \
            zip \
            cpio

      - name: Setup KernelSU-Next (non-GKI legacy mode)
        run: |
          set -e

          # 官方文档明确要求非 GKI 内核使用 "legacy" 参数集成：
          # https://kernelsu-next.github.io/webpage/zh_CN/pages/how-to-integrate-for-non-gki.html
          # 之前不带 -s legacy 走的是 GKI 向的默认集成方式，
          # 这在 Linux 4.4 (msm8998/chiron) 上会引入不兼容的代码。
          #
          # 之前直接 curl | bash 出过问题：GitHub 对 raw.githubusercontent.com
          # 偶尔会返回限流/反爬虫的错误页面而不是脚本内容，curl 不加 -f
          # 时不会因为 HTTP 错误状态码而失败，导致这段错误页面文本被当成
          # bash 脚本执行，报一堆语法错误。
          #
          # 这里改成: 下载到文件 -> 校验看起来像正常脚本(而不是HTML/限流提示)
          # -> 失败自动重试几次 -> 校验通过再执行。
          URL="https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh"
          OUT="setup_ksu.sh"

          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES: downloading setup.sh"

            if curl -fLSs --retry 3 --retry-delay 2 -o "$OUT" "$URL"; then
              # 简单校验: 正常脚本应该以 shebang 或 shell 常见语句开头，
              # 不应该包含 GitHub 限流/反爬虫页面的特征字符串。
              if grep -qi "rate limit\|scraping\|<html\|<!DOCTYPE" "$OUT"; then
                echo "Downloaded content looks like an error page, not a script. Retrying..."
                cat "$OUT"
                sleep $((i * 3))
                continue
              fi

              if [ ! -s "$OUT" ]; then
                echo "Downloaded file is empty. Retrying..."
                sleep $((i * 3))
                continue
              fi

              echo "Download looks valid, proceeding."
              break
            else
              echo "curl failed (HTTP error or network issue). Retrying..."
              sleep $((i * 3))
            fi

            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "Failed to download a valid setup.sh after $MAX_RETRIES attempts."
              exit 1
            fi
          done

          echo "----- setup.sh head (sanity check) -----"
          head -20 "$OUT"
          echo "-----------------------------------------"

          bash "$OUT" legacy

      - name: Check KernelSU files
        run: |
          echo "Listing drivers/kernelsu recursively:"
          find drivers/kernelsu -type f

          # 不再硬编码某一个文件名，动态找出所有 .h/.c 文件，
          # 后面统一在需要的文件里做兼容性判断
          echo "KernelSU source check complete."

      - name: Patch syscall_fn_t for Linux 4.4 (compat shim)
        run: |
          set -e

          # 动态定位可能需要 syscall_fn_t 的文件，而不是假设固定路径。
          # KernelSU-Next 的目录结构会随版本变化，硬编码路径容易在
          # 分支更新后直接导致 job 失败。
          TARGET_FILES=$(grep -rl "syscall_fn_t" drivers/kernelsu || true)

          if [ -z "$TARGET_FILES" ]; then
            echo "No files reference syscall_fn_t, nothing to patch."
            exit 0
          fi

          for FILE in $TARGET_FILES; do
            echo "Checking $FILE"

            # 如果这个文件里已经有我们的 compat guard 或者内核头本身
            # 已经定义了 syscall_fn_t 类型，就跳过，避免重复插入
            # 或者与已有定义冲突（#ifndef 对 typedef 无效，必须用
            # 自定义宏做 guard）。
            if grep -q "__KSU_SYSCALL_FN_T_COMPAT" "$FILE"; then
              echo "  already patched, skipping"
              continue
            fi

            echo "Before patch (head):"
            head -20 "$FILE"

            # 只在文件最顶部插入一次，用独立宏 guard，
            # 不依赖 typedef 本身作为 ifndef 条件。
            sed -i '1i #ifndef __KSU_SYSCALL_FN_T_COMPAT\n#define __KSU_SYSCALL_FN_T_COMPAT\ntypedef long (*syscall_fn_t)(const struct pt_regs *);\n#endif' "$FILE"

            echo "After patch (head):"
            head -30 "$FILE"
          done

      - name: Add compiler_types.h compat shim for old kernel (Linux 4.4)
        run: |
          set -e

          # msm8998 (chiron) 使用的是 Linux 4.4，而 include/linux/compiler_types.h
          # 是内核 4.11+ 才从 compiler.h 里拆分出来的独立头文件，4.4 树里根本
          # 不存在这个文件。KernelSU-Next v3.3.0 新增的 feature/sulog.c 是按
          # 现代内核写的，直接 #include <linux/compiler_types.h>，导致
          # "file not found"。
          #
          # 这里补一个兼容 shim：如果文件不存在就创建一个转发到 compiler.h
          # 的空壳，4.4 内核的 compiler.h 已经提供了大部分必需的宏
          # (likely/unlikely、属性宏等)，足够满足 sulog.c 的需求。
          HDR="include/linux/compiler_types.h"

          if [ -f "$HDR" ]; then
            echo "$HDR already exists, no shim needed."
          else
            echo "Creating compat shim at $HDR"
            cat > "$HDR" << 'EOF'
          #ifndef _LINUX_COMPILER_TYPES_H
          #define _LINUX_COMPILER_TYPES_H

          /*
           * Compatibility shim for kernels older than 4.11 that don't ship
           * include/linux/compiler_types.h. Newer code (e.g. KernelSU-Next)
           * expects this header to exist; on old trees the equivalent macros
           * live in compiler.h, so just forward to it.
           */
          #include <linux/compiler.h>

          #endif /* _LINUX_COMPILER_TYPES_H */
          EOF
            echo "Shim created:"
            cat "$HDR"
          fi

      - name: Setup Proton Clang
        run: |
          git clone \
          --depth=1 \
          --single-branch \
          https://github.com/kdrag0n/proton-clang \
          clang

      - name: Configure Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          mkdir -p out

          # Xiaomi MIX2 chiron
          make O=out chiron_defconfig

          # KernelSU-Next 在非 GKI 内核上优先使用 kprobe 方式做 hook
          # （而不是手动改内核源码）。上一次构建日志显示它已经自动
          # 选择了 "Hook mode: Kprobes" 并 patch 了 fs/namespace.c、
          # selinux 相关文件，说明这条路径本身是可行的。
          # 这里显式打开官方文档要求的三个配置项，避免因为 defconfig
          # 里没有这些项而被静默降级或跳过：
          # https://kernelsu-next.github.io/webpage/zh_CN/pages/how-to-integrate-for-non-gki.html
          scripts/config \
          --file out/.config \
          --enable CONFIG_KSU \
          --enable CONFIG_KPROBES \
          --enable CONFIG_KPROBE_EVENTS \
          --enable CONFIG_KSU_KPROBE_HOOKS

          make O=out olddefconfig

      - name: Check KernelSU config
        run: |
          grep -E "CONFIG_KSU|CONFIG_KPROBE" out/.config || true

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            -j"$(nproc)"

      - name: Check Kernel Output
        run: |
          find out/arch/arm64/boot -type f

      - name: Build AnyKernel3
        run: |
          git clone \
          --depth=1 \
          https://github.com/osm0sis/AnyKernel3 \
          AnyKernel3

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp \
            out/arch/arm64/boot/Image.gz-dtb \
            AnyKernel3/
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp \
            out/arch/arm64/boot/Image.gz \
            AnyKernel3/
          else
            echo "Kernel image not found!"
            exit 1
          fi

          cd AnyKernel3

          sed -i \
          's/kernel.string=.*/kernel.string=MIX2 MSM8998 KernelSU-Next/' \
          anykernel.sh

          # 明确指定机型代号，避免模板里残留其他机型信息
          # 导致刷机时被 anykernel.sh 的设备校验拦截。
          sed -i 's/device.name1=.*/device.name1=chiron/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=/' anykernel.sh
          sed -i 's/device.name3=.*/device.name3=/' anykernel.sh
          sed -i 's/device.name4=.*/device.name4=/' anykernel.sh
          sed -i 's/device.name5=.*/device.name5=/' anykernel.sh

          zip -r9 \
          ../KernelSU-MIX2-chiron.zip \
          .

      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-MIX2-chiron
          path: KernelSU-MIX2-chiron.zip
