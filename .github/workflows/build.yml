name: Build Xiaomi MIX2 MSM8998 KernelSU

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-22.04


    steps:

    - name: Checkout
      uses: actions/checkout@v4



    - name: Install dependencies
      run: |
        sudo apt update

        sudo apt install -y \
          bc \
          bison \
          flex \
          build-essential \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          gcc-arm-linux-gnueabihf \
          libssl-dev \
          libelf-dev \
          curl \
          python3 \
          unzip \
          zip



    - name: Setup KernelSU-Next
      run: |
        curl -LSs \
        "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
        | bash -



    # 修复 MSM8998 4.4 syscall_fn_t 缺失
    - name: Fix KernelSU syscall_fn_t
      run: |

        echo "Fix syscall_fn_t"

        grep -R "syscall_fn_t" -n drivers/kernelsu || true


        sed -i '/#include/a\
#ifndef syscall_fn_t\
typedef asmlinkage long (*syscall_fn_t)(const struct pt_regs *regs);\
#endif' \
        drivers/kernelsu/hook/syscall_hook.h


        grep -n "syscall_fn_t" \
        drivers/kernelsu/hook/syscall_hook.h



    - name: Setup clang
      run: |

        git clone --depth=1 \
        https://github.com/kdrag0n/proton-clang \
        clang




    - name: Configure kernel
      run: |

        export ARCH=arm64
        export SUBARCH=arm64


        mkdir out


        make O=out chiron_defconfig


        scripts/config \
        --file out/.config \
        --enable CONFIG_KSU


        make O=out olddefconfig




    - name: Build kernel
      run: |

        export ARCH=arm64
        export SUBARCH=arm64


        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH


        make \
          O=out \
          ARCH=arm64 \
          CC=clang \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          -j$(nproc)




    - name: Prepare AnyKernel3
      run: |

        git clone --depth=1 \
        https://github.com/osm0sis/AnyKernel3 \
        AnyKernel3


        cp \
        out/arch/arm64/boot/Image.gz-dtb \
        AnyKernel3/


        cd AnyKernel3


        sed -i \
        's/kernel.string=.*/kernel.string=MIX2 MSM8998 KernelSU-Next/' \
        anykernel.sh


        zip -r9 \
        ../KernelSU-MIX2-chiron.zip \
        .




    - name: Upload
      uses: actions/upload-artifact@v4

      with:
        name: KernelSU-MIX2-chiron

        path: KernelSU-MIX2-chiron.zip