name: Build Xiaomi MIX2 MSM8998 KernelSU-Next

'on':
  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-22.04


    steps:

      - name: Checkout Kernel Source
        uses: actions/checkout@v4


      - name: Install dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            bc \
            bison \
            flex \
            build-essential \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            gcc-arm-linux-gnueabihf \
            libssl-dev \
            libelf-dev \
            curl \
            python3 \
            unzip \
            zip \
            cpio


      - name: Setup KernelSU-Next
        run: |

          curl -LSs \
          "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
          | bash -


      - name: Check KernelSU files
        run: |

          ls -la drivers/kernelsu

          test -f drivers/kernelsu/hook/syscall_hook.h


      - name: Patch syscall_fn_t for Linux 4.4
        run: |

          FILE="drivers/kernelsu/hook/syscall_hook.h"


          echo "Before patch:"
          head -40 $FILE


          sed -i '/#include/a\
#ifndef syscall_fn_t\
typedef long (*syscall_fn_t)(const struct pt_regs *);\
#endif' \
          $FILE


          echo "After patch:"
          head -50 $FILE



      - name: Setup Proton Clang
        run: |

          git clone \
          --depth=1 \
          --single-branch \
          https://github.com/kdrag0n/proton-clang \
          clang



      - name: Configure Kernel
        run: |

          export ARCH=arm64
          export SUBARCH=arm64


          mkdir -p out


          # Xiaomi MIX2 chiron
          make O=out chiron