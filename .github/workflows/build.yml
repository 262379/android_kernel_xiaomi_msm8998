name: Build chiron kernel

# 本 workflow 假定放在你 fork 的
# LineageOS/android_kernel_xiaomi_msm8998 仓库里的 .github/workflows/ 下,
# 直接对 checkout 出来的这份内核源码打补丁 + 编译,不再单独克隆一次内核仓库。
# 在 Actions 页手动触发时,右上角分支下拉框选你要编译的分支(比如 lineage-22.2)。

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "内核源码仓库(owner/repo),留空则使用当前 workflow 所在仓库"
        required: false
        default: ""
      kernel_branch:
        description: "内核源码分支/tag/commit,留空则使用当前触发所在分支"
        required: false
        default: ""
      defconfig:
        description: "defconfig 名称,可以只填文件名(如 chiron_defconfig),也可以带子目录(如 vendor/chiron_defconfig),或整个 arch/arm64/configs/ 完整路径,均会自动兼容解析"
        required: false
        default: "chiron_defconfig"
      anykernel_repo:
        description: "AnyKernel3 模板仓库(会用 anykernel/anykernel.sh 覆盖其中的 anykernel.sh)"
        required: false
        default: "osm0sis/AnyKernel3"

env:
  ARCH: arm64
  # 64-bit / 32-bit(compat vDSO)交叉工具链前缀,配合 LLVM=1 使用
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_ARM32: arm-linux-gnueabi-

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          # 留空 kernel_repo/kernel_branch 时,回退到当前仓库 + 当前触发分支
          # (即原来 "checkout this fork" 的行为);填了则拉取指定仓库的指定分支/tag/commit。
          # 注意:若目标仓库为私有仓库,需要额外配置有权限的 token(此处未处理)。
          repository: ${{ github.event.inputs.kernel_repo != '' && github.event.inputs.kernel_repo || github.repository }}
          ref: ${{ github.event.inputs.kernel_branch != '' && github.event.inputs.kernel_branch || github.ref }}
          fetch-depth: 1

      - name: "Checkout CI tools (this workflow's own repo: anykernel/)"
        uses: actions/checkout@v4
        with:
          # anykernel/anykernel.sh 始终来自当前 workflow 所在的这个仓库,
          # 所以单独 checkout 到 ci-tools/ 子目录,不与内核源码混在一起。
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: ci-tools
          fetch-depth: 1

      - name: Normalize defconfig path
        run: |
          raw="${{ github.event.inputs.defconfig }}"
          # 去掉开头误填的 "./"
          raw="${raw#./}"
          # 兼容三种填法:
          #   1) 纯文件名            chiron_defconfig
          #   2) 带子目录(不含前缀)  vendor/chiron_defconfig
          #   3) 完整路径            arch/arm64/configs/chiron_defconfig
          # 统一去掉 "arch/arm64/configs/" 或 "arch/${ARCH}/configs/" 前缀,
          # 只保留相对 configs 目录的部分,作为 make 的 defconfig target。
          target="${raw#arch/arm64/configs/}"
          target="${target#arch/${ARCH}/configs/}"
          if [ -z "$target" ]; then
            echo "::error::defconfig 输入为空,请检查 workflow_dispatch 参数"
            exit 1
          fi
          echo "DEFCONFIG_TARGET=$target" >> "$GITHUB_ENV"
          echo "DEFCONFIG_FILE=arch/arm64/configs/$target" >> "$GITHUB_ENV"
          echo "解析结果: DEFCONFIG_TARGET=$target"
          echo "解析结果: DEFCONFIG_FILE=arch/arm64/configs/$target"
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev \
            build-essential ca-certificates curl git \
            python3 python3-pip \
            zip unzip device-tree-compiler \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi
      - name: Fetch Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
      
          echo "$PWD/clang/bin" >> "$GITHUB_PATH"
      
          clang --version

      - name: Debug shell
        run: |
          ls -l /bin/sh
          grep -R "Using .. as source for kernel" -n .
          
      - name: Configure kernel
        run: |
          # 仓库里 chiron_defconfig 本身就是完整 defconfig,不存在
          # vendor/xiaomi/mi8998_defconfig 这个 base 或 vendor/xiaomi/chiron.config
          # 这个 fragment,所以直接用前面 Normalize 步骤算出来的 $DEFCONFIG_TARGET,
          # 不再走 base+merge 的两步流程。
          echo "使用 defconfig: $DEFCONFIG_TARGET"
          make O=out ARCH=${ARCH} \
            LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=${CROSS_COMPILE} \
            CROSS_COMPILE_ARM32=${CROSS_COMPILE_ARM32} \
            "$DEFCONFIG_TARGET"

          # 补全默认配置
          make O=out ARCH=${ARCH} olddefconfig

      - name: Enable CONFIG_KALLSYMS support
        run: |
          # CONFIG_KALLSYMS_ALL 通常 depends on DEBUG_KERNEL && KALLSYMS,
          # 所以必须一并打开 CONFIG_DEBUG_KERNEL,否则 olddefconfig 会静默把它退回未设置。
          ./scripts/config --file out/.config \
            --enable CONFIG_KALLSYMS \
            --enable CONFIG_DEBUG_KERNEL \
            --enable CONFIG_KALLSYMS_ALL

          make O=out ARCH=${ARCH} olddefconfig

          echo "===== 校验 KALLSYMS 配置 ====="
          grep -E "^CONFIG_(KALLSYMS(_ALL)?|DEBUG_KERNEL)=" out/.config
          if ! grep -q "^CONFIG_KALLSYMS_ALL=y" out/.config; then
            echo "::error::CONFIG_KALLSYMS_ALL 仍未生效,可能还有其他未满足的 depends on,请检查 kernel/Kconfig.debug 中 KALLSYMS_ALL 的实际依赖"
            exit 1
          fi

      - name: Build kernel
        run: |
          make -j"$(nproc)" O=out ARCH=${ARCH} \
            LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=${CROSS_COMPILE} \
            CROSS_COMPILE_ARM32=${CROSS_COMPILE_ARM32} \
            2>&1 | tee build.log
      - name: Debug output
        run: |
          echo "===== boot ====="
          find out/arch/arm64/boot -maxdepth 2 -type f
          echo "===== search Image ====="
          find out -name "Image*" -print
          echo "===== search dtb ====="
          find out -name "*.dtb" -print
          echo "===== search Image.gz ====="
          find out -name "*.gz" -print
          echo "===== search Image.lz4 ====="
          find out -name "*.lz4" -print
      - name: Collect kernel image
        run: |
          mkdir -p dist
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Using Image.gz-dtb"
            cp out/arch/arm64/boot/Image.gz-dtb dist/
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "Using Image.gz"
            cp out/arch/arm64/boot/Image.gz dist/
          elif [ -f out/arch/arm64/boot/Image ]; then
            echo "Using Image"
            cp out/arch/arm64/boot/Image dist/
          else
            echo "Kernel image not found!"
            find out -name "Image*" -print
            exit 1
          fi
          echo "===== dist ====="
          ls -al dist
      - name: Upload raw kernel image artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiron-kernel-image-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error

      - name: Fetch mkbootimg tools
        run: |
          # 用官方 AOSP 的纯 Python 版 unpack_bootimg.py / mkbootimg.py,
          # 避免依赖某个第三方预编译 magiskboot 二进制的架构/来源问题。
          git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg mkbootimg-tools

      - name: Repack boot.img with new kernel
        run: |
          BASE_BOOT_IMG="ci-tools/.github/workflows/boot.img"
          if [ ! -f "$BASE_BOOT_IMG" ]; then
            echo "::error::找不到底包 $BASE_BOOT_IMG,请确认已放在 .github/workflows/boot.img"
            exit 1
          fi

          # 找到刚编译出来的内核镜像(与 Collect kernel image 步骤同样的优先级)
          if [ -f dist/Image.gz-dtb ]; then
            NEW_KERNEL="dist/Image.gz-dtb"
          elif [ -f dist/Image.gz ]; then
            NEW_KERNEL="dist/Image.gz"
          elif [ -f dist/Image ]; then
            NEW_KERNEL="dist/Image"
          else
            echo "::error::dist/ 下找不到编译好的内核镜像"
            exit 1
          fi
          echo "使用内核: $NEW_KERNEL"

          mkdir -p unpacked
          # --format=mkbootimg 会把底包的 header 信息(cmdline/base/pagesize/
          # os_version/header_version 等)还原成一串可以直接喂给 mkbootimg.py
          # 的参数,这样只需要把里面指向旧内核的部分换成新内核即可,其余
          # (ramdisk、dtb、cmdline 等)全部原样保留。
          python3 mkbootimg-tools/unpack_bootimg.py \
            --boot_img "$BASE_BOOT_IMG" \
            --out unpacked \
            --format=mkbootimg > mkbootimg_args.txt
          echo "===== 底包解析出的 mkbootimg 参数 ====="
          cat mkbootimg_args.txt

          # 把参数里指向旧内核(unpacked/kernel)的部分替换成新编译的内核
          sed -i "s#--kernel [^ ]*#--kernel $NEW_KERNEL#" mkbootimg_args.txt

          eval "python3 mkbootimg-tools/mkbootimg.py $(cat mkbootimg_args.txt) --output dist/boot.img"

          echo "===== dist ====="
          ls -al dist

      - name: Upload boot.img artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiron-boot-img-${{ github.run_number }}
          path: dist/boot.img
          if-no-files-found: error

      - name: Fetch AnyKernel3 template
        run: |
          git clone --depth 1 "https://github.com/${{ github.event.inputs.anykernel_repo }}.git" AnyKernel3
          cp ci-tools/anykernel/anykernel.sh AnyKernel3/anykernel.sh
      - name: Copy kernel image into AnyKernel3
        run: |
          if [ -f dist/Image.gz-dtb ]; then
            cp dist/Image.gz-dtb AnyKernel3/Image.gz-dtb
          elif [ -f dist/Image.gz ]; then
            cp dist/Image.gz AnyKernel3/Image.gz
          elif [ -f dist/Image ]; then
            cp dist/Image AnyKernel3/Image
          else
            echo "No kernel image found in dist!"
            ls -al dist
            exit 1
          fi
      - name: Pack AnyKernel3 zip
        working-directory: AnyKernel3
        run: |
          zip -r9 "../AnyKernel3-chiron-${{ github.run_number }}.zip" \
            * -x ".git*" "README.md"
      - name: Upload AnyKernel3 flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-chiron-${{ github.run_number }}
          path: AnyKernel3-chiron-${{ github.run_number }}.zip
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
