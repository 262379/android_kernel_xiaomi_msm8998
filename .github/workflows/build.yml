name: Build chiron kernel (KernelSU-Next manual hook)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "内核源码仓库"
        required: false
        default: "LineageOS/android_kernel_xiaomi_msm8998"
      kernel_branch:
        description: "内核源码分支"
        required: false
        default: "lineage-22.2"
      defconfig:
        description: "defconfig 文件名(不含路径)"
        required: false
        default: "chiron_defconfig"
      ksu_next_ref:
        description: "KernelSU-Next 分支/tag(setup.sh 拉取用)"
        required: false
        default: "next"
      anykernel_repo:
        description: "AnyKernel3 模板仓库(会用 anykernel/anykernel.sh 覆盖其中的 anykernel.sh)"
        required: false
        default: "osm0sis/AnyKernel3"

env:
  KERNEL_DIR: kernel_src
  ARCH: arm64
  # 64-bit / 32-bit(compat vDSO)交叉工具链前缀,配合 LLVM=1 使用
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_ARM32: arm-linux-gnueabi-

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout workflow/scripts repo
        uses: actions/checkout@v4
        with:
          path: workflow-repo

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.kernel_repo }}
          ref: ${{ github.event.inputs.kernel_branch }}
          path: ${{ env.KERNEL_DIR }}
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev \
            build-essential ca-certificates curl git \
            python3 python3-pip \
            zip unzip device-tree-compiler \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      # Clang: 官方 AOSP 预编译工具链(克隆一个较小的稳定 tag,避免整个仓库历史)
      - name: Fetch Clang toolchain
        run: |
          mkdir -p clang
          curl -L -o clang.tar.gz \
            "https://github.com/greenforce-project/greenforce_clang/releases/latest/download/greenforce-clang.tar.gz" \
            || curl -L -o clang.tar.gz \
            "https://github.com/ZyCromerZ/Clang/releases/latest/download/Clang-latest.tar.gz"
          tar -xf clang.tar.gz -C clang
          echo "$PWD/clang/bin" >> "$GITHUB_PATH"

      - name: Add KernelSU-Next to kernel source tree
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${{ github.event.inputs.ksu_next_ref }}/kernel/setup.sh" | bash -s "${{ github.event.inputs.ksu_next_ref }}"

      - name: Apply manual hook patches
        run: |
          python3 workflow-repo/scripts/ksu_manual_patch.py \
            "${KERNEL_DIR}" \
            "${KERNEL_DIR}/arch/arm64/configs/${{ github.event.inputs.defconfig }}"

      - name: Show resulting patch (for CI log review)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          git diff --stat || true
          tail -n 6 "arch/arm64/configs/${{ github.event.inputs.defconfig }}"

      - name: Build kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          export PATH="$PWD/../clang/bin:$PATH"
          make -j"$(nproc)" O=out ARCH=${ARCH} \
            LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=${CROSS_COMPILE} \
            CROSS_COMPILE_ARM32=${CROSS_COMPILE_ARM32} \
            ${{ github.event.inputs.defconfig }}
          make -j"$(nproc)" O=out ARCH=${ARCH} \
            LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=${CROSS_COMPILE} \
            CROSS_COMPILE_ARM32=${CROSS_COMPILE_ARM32} \
            2>&1 | tee build.log

      - name: Locate build output
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          find out/arch/arm64/boot -maxdepth 1 -type f \( -name "Image*" -o -name "*.dtb" \) -print
          mkdir -p ../dist
          cp out/arch/arm64/boot/Image.gz-dtb ../dist/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image.gz ../dist/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image ../dist/ 2>/dev/null || true
          ls ../dist

      - name: Upload raw kernel image artifact
        uses: actions/upload-artifact@v4
        with:
          name: chiron-kernel-image-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error

      - name: Fetch AnyKernel3 template
        run: |
          git clone --depth 1 "https://github.com/${{ github.event.inputs.anykernel_repo }}.git" AnyKernel3
          cp workflow-repo/anykernel/anykernel.sh AnyKernel3/anykernel.sh

      - name: Copy kernel image into AnyKernel3
        run: |
          # 优先用 Image.gz-dtb,没有就退回 Image.gz / Image
          if [ -f dist/Image.gz-dtb ]; then
            cp dist/Image.gz-dtb AnyKernel3/Image.gz-dtb
          elif [ -f dist/Image.gz ]; then
            cp dist/Image.gz AnyKernel3/Image.gz
          else
            cp dist/Image AnyKernel3/Image
          fi

      - name: Pack AnyKernel3 zip
        working-directory: AnyKernel3
        run: |
          zip -r9 "../AnyKernel3-chiron-ksu-next-manual-${{ github.run_number }}.zip" \
            * -x ".git*" "README.md"

      - name: Upload AnyKernel3 flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-chiron-ksu-next-manual-${{ github.run_number }}
          path: AnyKernel3-chiron-ksu-next-manual-${{ github.run_number }}.zip
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: ${{ env.KERNEL_DIR }}/build.log
